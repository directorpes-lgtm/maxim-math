<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb">
<title>Математика Максима</title>
<style>
:root{--blue:#2563eb;--ink:#172033;--muted:#64748b;--bg:#f3f6fc;--card:#fff;--line:#dbe4f0;--green:#16834a;--red:#c0392b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:linear-gradient(120deg,#1d4ed8,#60a5fa);color:white;padding:25px 18px 32px}header .wrap,main{max-width:900px;margin:auto}h1{font-size:clamp(26px,5vw,38px);margin:0 0 5px}header p{margin:0;opacity:.94}
main{padding:18px;display:grid;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 5px 18px #1e3a8a0a}
h2{font-size:19px;margin:0 0 12px}.muted{color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,select{font:inherit;border-radius:12px;border:1px solid var(--line);padding:11px 14px;background:white;color:var(--ink);cursor:pointer}
button.primary{background:var(--blue);border-color:var(--blue);color:white;font-weight:700}button:disabled{opacity:.45;cursor:not-allowed}
button.active{border-color:var(--blue);background:#eff6ff;color:#1d4ed8;font-weight:700}
select{min-width:190px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f8fafc;border-radius:12px;padding:12px}.stat b{display:block;font-size:23px}.stat span{font-size:13px;color:var(--muted)}
.question{font-size:clamp(30px,7vw,48px);font-weight:800;text-align:center;margin:16px 0 20px;letter-spacing:.5px}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.answer{font-size:22px;font-weight:700;padding:16px}.answer.correct{background:#dcfce7;border-color:#22a06b;color:#166534}.answer.wrong{background:#fee2e2;border-color:#ef4444;color:#991b1b}
.feedback{padding:13px;border-radius:12px;margin-top:14px}.feedback.good{background:#dcfce7;color:#166534}.feedback.bad{background:#fff1f2;color:#9f1239}
.progress{height:9px;background:#e2e8f0;border-radius:9px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:var(--blue);width:0;transition:width .2s}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:9px}.topic{border:1px solid var(--line);border-radius:12px;padding:11px}.topic b{display:block}.topic small{color:var(--muted)}
.hidden{display:none!important}.foot{font-size:13px;color:var(--muted);text-align:center;padding:4px 0 18px}
@media(max-width:520px){main{padding:12px}.card{padding:15px}.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:9px}.stat b{font-size:19px}.answers{gap:8px}.answer{padding:14px 8px}}
</style>
</head>
<body>
<header><div class="wrap"><h1>⭐ Математика Максима</h1><p>Тренируемся, растём и становимся увереннее с каждым примером!</p></div></header>
<main>
<section class="card">
<h2>Выбери тренировку</h2>
<div class="row" style="margin-bottom:12px"><button class="mode active" data-mode="ten">10 заданий</button><button class="mode" data-mode="choice">4 варианта ответа</button><button id="weakBtn">Повторить сложное</button></div>
<div class="row"><label for="topic">Тема:</label><select id="topic"><option value="mix">Все темы</option><option value="add">Сложение до 100</option><option value="sub">Вычитание до 100</option><option value="compare">Сравнение чисел</option><option value="multiply">Умножение</option><option value="word">Текстовые задачи</option></select><button id="start" class="primary">Начать</button></div>
</section>
<section class="card" id="game">
<div class="row" style="justify-content:space-between"><b id="counter">Готов к занятиям?</b><span id="score" class="muted">Верно: 0</span></div><div class="progress"><i id="bar"></i></div>
<div id="prompt" class="question">Нажми «Начать»</div>
<div id="answers" class="answers"></div>
<div id="feedback" class="feedback hidden" aria-live="polite"></div>
<div class="row" style="justify-content:space-between;margin-top:14px"><button id="speak">🔊 Прочитать</button><button id="next" class="primary" disabled>Следующее</button></div>
</section>
<section class="card"><h2>Мой прогресс</h2><div class="stats"><div class="stat"><b id="total">0</b><span>решено заданий</span></div><div class="stat"><b id="accuracy">0%</b><span>точность</span></div><div class="stat"><b id="streak">0</b><span>верно подряд</span></div></div><div id="topics" class="topic-grid" style="margin-top:13px"></div><div class="row" style="margin-top:12px"><button id="reset">Сбросить прогресс</button><span class="muted">Данные сохраняются на этом устройстве.</span></div></section>
<div class="foot">Математика может быть интересной. Даже до завтрака 🙂</div>
</main>
<script>
const names={add:'Сложение',sub:'Вычитание',compare:'Сравнение',multiply:'Умножение',word:'Задачи'};
const $=id=>document.getElementById(id);
let mode='ten',tasks=[],idx=0,correct=0,answered=false,streak=0;
let data=JSON.parse(localStorage.getItem('maximMathProgress')||'{"total":0,"correct":0,"streak":0,"topics":{},"weak":[]}');
function save(){localStorage.setItem('maximMathProgress',JSON.stringify(data));renderStats()}
function rand(n){return Math.floor(Math.random()*n)}
function int(a,b){return a+rand(b-a+1)}
function makeTask(topic){
 if(topic==='mix')topic=['add','sub','compare','multiply','word'][rand(5)];
 let a,b,q,ans,exp;
 if(topic==='add'){a=int(11,69);b=int(11,Math.min(89,100-a));q=a+' + '+b+' = ?';ans=a+b;exp='Складываем десятки и единицы: '+a+' + '+b+' = '+ans+'.'}
 if(topic==='sub'){a=int(20,100);b=int(11,a-1);q=a+' − '+b+' = ?';ans=a-b;exp='Вычитаем: '+a+' − '+b+' = '+ans+'.'}
 if(topic==='compare'){a=int(1,100);b=int(1,100);q=a+'  □  '+b+'  (вставь знак)';ans=a>b?'>':a<b?'<':'=';exp='Сравниваем числа: '+a+' '+ans+' '+b+'.'}
 if(topic==='multiply'){a=int(2,9);b=int(2,5);q=a+' × '+b+' = ?';ans=a*b;exp=a+' × '+b+' означает '+a+' сложить '+b+' раз: '+Array(b).fill(a).join(' + ')+' = '+ans+'.'}
 if(topic==='word'){let apples=int(12,35),more=int(3,15);q='У Максима было '+apples+' наклеек. Ему подарили ещё '+more+'. Сколько стало?';ans=apples+more;exp='Наклеек стало больше, значит складываем: '+apples+' + '+more+' = '+ans+'.'}
 return {topic,q,ans,exp};
}
function optionsFor(t){if(t.topic==='compare')return ['<','=','>','?'].sort(()=>Math.random()-.5);let vals=new Set([Number(t.ans)]);while(vals.size<4){let d=int(-10,10);vals.add(Math.max(0,Number(t.ans)+d))}return [...vals].sort(()=>Math.random()-.5)}
function start(){let topic=$('topic').value;tasks=Array.from({length:10},()=>makeTask(topic));if(mode==='choice'&&topic==='mix'){}idx=0;correct=0;showTask()}
function startWeak(){let w=data.weak||[];if(!w.length){$('feedback').className='feedback good';$('feedback').textContent='Пока нет сложных заданий. Продолжай тренироваться!';return}tasks=w.slice(-10).reverse().map(x=>makeTask(x.topic));idx=0;correct=0;showTask()}
function showTask(){answered=false;$('feedback').className='feedback hidden';$('feedback').textContent='';$('next').disabled=true;$('counter').textContent='Задание '+(idx+1)+' из '+tasks.length;$('score').textContent='Верно: '+correct;$('bar').style.width=(idx/tasks.length*100)+'%';let t=tasks[idx];$('prompt').textContent=t.q;$('answers').innerHTML='';
 let opts=mode==='choice'?optionsFor(t):null;
 if(mode==='choice'){opts.forEach(v=>addAnswer(v,t))}else{let input=document.createElement('input');input.id='typed';input.inputMode='decimal';input.placeholder='Твой ответ';input.style='width:100%;font:700 24px system-ui;text-align:center;padding:14px;border:2px solid #cbd5e1;border-radius:12px;grid-column:1/-1';$('answers').append(input);input.addEventListener('keydown',e=>{if(e.key==='Enter')check(input.value) });let b=document.createElement('button');b.className='primary';b.textContent='Проверить';b.style.gridColumn='1/-1';b.onclick=()=>check(input.value.trim());$('answers').append(b);setTimeout(()=>input.focus(),50)}
}
function addAnswer(v,t){let b=document.createElement('button');b.className='answer';b.textContent=v;b.onclick=()=>check(v);$('answers').append(b)}
function check(value){if(answered)return;let t=tasks[idx],ok=String(value).trim()===String(t.ans);answered=true;
 if(ok){correct++;streak++;data.correct++;data.streak=streak}else{streak=0;data.streak=0;data.weak.push({topic:t.topic,q:t.q,at:Date.now()});if(data.weak.length>40)data.weak.shift()}
 data.total++;data.topics[t.topic]??={total:0,correct:0};data.topics[t.topic].total++;if(ok)data.topics[t.topic].correct++;save();
 if(mode==='choice'){[...$('answers').children].forEach(b=>{if(b.textContent===String(t.ans))b.classList.add('correct');else if(b.textContent===String(value))b.classList.add('wrong');b.disabled=true})}
 $('feedback').className='feedback '+(ok?'good':'bad');$('feedback').textContent=(ok?'Правильно! 🎉 ':'Пока не получилось. Правильный ответ: '+t.ans+'. ')+t.exp;
 $('score').textContent='Верно: '+correct;$('next').disabled=false;
 if(idx===tasks.length-1)$('next').textContent='Итоги';}
function next(){if(!answered)return;if(idx<tasks.length-1){idx++;showTask()}else{ $('prompt').textContent='Тренировка завершена!';$('answers').innerHTML='';$('feedback').className='feedback good';$('feedback').textContent='Максим, ты решил '+correct+' из '+tasks.length+' заданий. '+(correct===10?'Идеально! Так держать!':'Каждая тренировка делает тебя сильнее. Повтори сложные задания!');$('counter').textContent='Готово';$('bar').style.width='100%';$('next').disabled=true;$('next').textContent='Следующее'}}
function renderStats(){ $('total').textContent=data.total||0;$('accuracy').textContent=(data.total?Math.round(data.correct/data.total*100):0)+'%';$('streak').textContent=data.streak||0;$('topics').innerHTML='';Object.keys(names).forEach(k=>{let v=data.topics[k]||{total:0,correct:0};let d=document.createElement('div');d.className='topic';d.innerHTML='<b>'+names[k]+'</b><small>'+v.correct+' из '+v.total+' верно</small>'; $('topics').append(d)})}
function speak(){let t=tasks[idx];if(!t)return;let u=new SpeechSynthesisUtterance(t.q);u.lang='ru-RU';speechSynthesis.cancel();speechSynthesis.speak(u)}
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x===b));$('answers').innerHTML='';$('prompt').textContent='Режим выбран. Нажми «Начать».'});
$('start').onclick=start;$('weakBtn').onclick=startWeak;$('next').onclick=next;$('speak').onclick=speak;
$('reset').onclick=()=>{if(confirm('Точно сбросить весь прогресс?')){data={total:0,correct:0,streak:0,topics:{},weak:[]};streak=0;save()}};
renderStats();
</script></body></html>
